name: Java CI

on:
  pull_request:
    branches:
      - master
      - '*/dev'          # все ветки вида a/dev, b/dev, c/dev
  push:
    branches:
      - '*/dev'          # пуш в dev-ветки также запускает CI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean test